name: בניית האפליקציה

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Shefa.xcodeproj -scheme Shefa \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package the app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shefa.app Payload/
          zip -qry Shefa.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Shefa-ipa
          path: ios/Shefa.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 3
