name: צילומי מסך

on:
  workflow_dispatch:
    inputs:
      screens:
        description: Screens to capture, separated by spaces
        default: "home finance-overview finance-transactions finance-budget finance-savings tasks more schedule"
      dark:
        description: Screens to capture again in dark mode, separated by spaces
        default: ""
      month:
        description: Month the finance screens open on, such as 2026-10
        default: ""
      demo:
        description: Fill the app with a few example lines (yes/no)
        default: "yes"
      clock:
        description: A fixed day and hour for the whole run, in Israel time, such as 2026-11-17T09:41
        default: ""

permissions:
  contents: write

concurrency:
  group: shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"

      - name: Build for the simulator
        working-directory: ios
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate
          set -o pipefail
          # One architecture is enough for the simulator, and compiling the
          # module as a whole reports every error in a single run.
          xcodebuild build -project Shefa.xcodeproj -scheme Shefa -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_ARCHS=x86_64 SWIFT_COMPILATION_MODE=wholemodule \
            | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Capture
        env:
          SCREENS: ${{ inputs.screens }}
          DARK: ${{ inputs.dark }}
          MONTH: ${{ inputs.month }}
          DEMO: ${{ inputs.demo }}
          CLOCK: ${{ inputs.clock }}
        run: |
          # The simulator follows this machine's clock. The family's own time
          # zone, so the times of the day and the clock agree; and, when asked,
          # a fixed day and hour, so a screen that depends on them can be seen.
          sudo systemsetup -settimezone Asia/Jerusalem >/dev/null 2>&1 || true
          device=""
          shown="9:41"
          setclock() {
            sudo systemsetup -setusingnetworktime off >/dev/null 2>&1 || true
            sudo date -f "%Y-%m-%dT%H:%M" "$1" >/dev/null || true
            date
            # The status bar shows the same hour, on a twelve-hour clock as
            # the simulator itself shows it. A round hour is refused as a
            # broken date, so the minute after it is shown instead.
            hm="${1#*T}"
            hour=$((10#${hm%%:*}))
            minute="${hm##*:}"
            if [ "$minute" = "00" ]; then minute="01"; fi
            shown="$(( (hour + 11) % 12 + 1 )):$minute"
            if [ -n "$device" ]; then
              xcrun simctl status_bar "$device" override --time "$shown" --batteryState charged --batteryLevel 100 || true
            fi
          }
          if [ -n "$CLOCK" ]; then setclock "$CLOCK"; fi
          app=ios/build/Build/Products/Debug-iphonesimulator/Shefa.app
          device=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro Max" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          fi
          xcrun simctl list devices available | grep "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl status_bar "$device" override --time "$shown" --batteryState charged --batteryLevel 100 || true
          mkdir -p shots
          extra=""
          if [ -n "$MONTH" ]; then extra="$extra -month $MONTH"; fi
          if [ "$DEMO" = "yes" ]; then extra="$extra -demo YES"; fi
          tag=""
          # The first launch after an install builds the store and fills it,
          # and takes longer to settle than the ones after it.
          fresh=1
          capture() {
            # An item is a screen, optionally with a place to scroll to and
            # a mood for the month card: screen@anchor@mood. Three words
            # change what follows them: clock=2026-11-20T13:30 moves the day
            # and the hour, tag=name is added to the file names, and reset
            # starts the app from nothing.
            for item in $2; do
              case "$item" in
                clock=*) setclock "${item#clock=}"; continue ;;
                tag=*) tag="-${item#tag=}"; continue ;;
                reset)
                  xcrun simctl uninstall "$device" app.shefa.ios >/dev/null 2>&1 || true
                  xcrun simctl install "$device" "$app"
                  fresh=1
                  continue ;;
              esac
              IFS='@' read -r screen anchor mood <<< "$item"
              more=""
              if [ -n "$mood" ]; then more="-mood $mood"; fi
              xcrun simctl terminate "$device" app.shefa.ios >/dev/null 2>&1 || true
              xcrun simctl launch "$device" app.shefa.ios -screen "$screen" -anchor "$anchor" $extra $more
              if [ -n "$fresh" ]; then sleep 14; fresh=""; else sleep 6; fi
              name="$screen"
              if [ -n "$anchor" ]; then name="$name-$anchor"; fi
              if [ -n "$mood" ]; then name="$name-$mood"; fi
              name="$name$tag"
              xcrun simctl io "$device" screenshot "shots/$name$1.png"
              # A launch that was slow shows the opening color alone, and
              # such a picture is tiny: wait and take it again.
              if [ "$(stat -f%z "shots/$name$1.png")" -lt 300000 ]; then
                sleep 8
                xcrun simctl io "$device" screenshot "shots/$name$1.png"
              fi
              sips -Z 1500 "shots/$name$1.png" >/dev/null
            done
          }
          xcrun simctl ui "$device" appearance light
          capture "" "$SCREENS"
          if [ -n "$DARK" ]; then
            xcrun simctl ui "$device" appearance dark
            tag=""
            capture "-dark" "$DARK"
          fi
          # The real time again, before anything is sent anywhere.
          sudo systemsetup -setusingnetworktime on >/dev/null 2>&1 || true
          sudo sntp -sS time.apple.com >/dev/null 2>&1 || true
          date

      - name: Publish to the screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="shefa-bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
